# KaTeX https://zensical.org/docs/authoring/math/#katex
extra_css = [
  "stylesheets/extra.css",
  "https://unpkg.com/katex/dist/katex.min.css",
]

extra_javascript = [
  "https://unpkg.com/katex/dist/katex.min.js",
  "https://unpkg.com/katex/dist/contrib/auto-render.min.js",
  "javascripts/katex.js",
  "https://unpkg.com/tablesort/dist/tablesort.min.js",
  "javascripts/tablesort.js",
]

# https://facelessuser.github.io/pymdown-extensions/

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

# Theme https://zensical.org/docs/setup/navigation/
[project.theme]
custom_dir = "overrides"
features = [
  "navigation.footer",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "navigation.path",
  "navigation.indexes",
  "navigation.top",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "toc.follow",
  "search.highlight",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "content.footnote.tooltips",
  "content.tooltips",
]

# Colors https://zensical.org/docs/setup/colors/
# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

# Logo and Icons https://zensical.org/docs/setup/logo-and-icons/
[project.theme.icon]
logo = "material/atom-variant"
repo = "fontawesome/brands/github"

# Footer https://zensical.org/docs/setup/footer/
[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:linkch@qq.com"
name = "Email"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/linkch0"
name = "GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/bilibili"
link = "https://space.bilibili.com/33514662"
name = "Bilibili"

# Admonitions https://zensical.org/docs/authoring/admonitions/
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]

# Code blocks https://zensical.org/docs/authoring/code-blocks/
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]

# Content tabs https://zensical.org/docs/authoring/content-tabs/
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tabbed.slugify]
object = "pymdownx.slugs.slugify"
kwds = { case = "lower" }

# Data tables https://zensical.org/docs/authoring/data-tables/
[project.markdown_extensions.tables]

# Diagrams https://zensical.org/docs/authoring/diagrams/
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

# Footnotes https://zensical.org/docs/authoring/footnotes/
[project.markdown_extensions.footnotes]

# Formatting https://zensical.org/docs/authoring/formatting/
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tilde]

# Grids https://zensical.org/docs/authoring/grids/
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]

# Icons, Emojis https://zensical.org/docs/authoring/icons-emojis/
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

# Images https://zensical.org/docs/authoring/images/
[project.markdown_extensions.pymdownx.blocks.caption]

# Lists https://zensical.org/docs/authoring/lists/
[project.markdown_extensions.def_list]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

# Tooltips https://zensical.org/docs/authoring/tooltips/
[project.markdown_extensions.abbr]

# Default configuration https://zensical.org/docs/setup/extensions/about/#default-configuration
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.smartsymbols]

# Glightbox https://zensical.org/docs/setup/extensions/glightbox/
[project.markdown_extensions.zensical.extensions.glightbox]
